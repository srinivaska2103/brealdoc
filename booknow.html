<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%220.9em%22 font-size=%2290%22>🚗</text></svg>">
    <title>Schedule Service | BrakeDoc Mobile Appointment</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            500: '#f43f5e', /* Sleek Automotive Rose/Red Theme Accent Color */
                            600: '#e11d48',
                            700: '#be123c',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Modern Clean Fonts & Icon Libraries -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- TOP HEADER UTILITY BAR -->
    <header class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between relative z-50">
        <!-- Name Logo Top Left Corner redirecting to homepage -->
        <a href="index.html" class="flex items-center gap-2 group focus:outline-none" title="Return to Homepage">
            <i class="fa-solid fa-car-burst text-brand-500 text-2xl sm:text-3xl transition-transform group-hover:scale-105"></i>
            <span class="text-lg sm:text-xl font-bold tracking-tight text-slate-900 dark:text-white">Brake<span class="text-brand-500">Doc</span></span>
        </a>

        <!-- Persistent Layout Control Toggle Buttons -->
        <div class="flex items-center space-x-2 sm:space-x-3 rtl:space-x-reverse">
            <!-- LTR/RTL Layout Flow Toggle -->
<button id="rtl-toggle" class="w-10 h-10 inline-flex items-center justify-center rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-brand-500 hover:bg-slate-200/50 dark:hover:bg-slate-700/50 transition-all text-xs font-bold shrink-0" title="Toggle Layout Direction">
    LTR
</button>

<!-- Light/Dark Mode Theme Toggle -->
<button id="theme-toggle" class="w-10 h-10 inline-flex items-center justify-center rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-brand-500 hover:bg-slate-200/50 dark:hover:bg-slate-700/50 transition-all shrink-0" title="Toggle Theme">
    <i id="theme-icon" class="fa-solid fa-moon text-sm"></i>
</button>
        </div>
    </header>

    <!-- MAIN INTERACTIVE BOOKING CONTAINER -->
    <main class="flex-grow flex items-center justify-center px-4 py-6 sm:py-12 relative z-10">
        
        <!-- Ambient Background Glow Flares -->
        <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-72 sm:w-[600px] h-72 sm:h-[600px] bg-brand-500/5 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Booking Form Chassis -->
        <div class="w-full max-w-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800/80 rounded-3xl shadow-xl p-6 sm:p-8 backdrop-blur-md transition-all duration-300">
            
            <!-- Page Section Header -->
            <div class="space-y-1 text-center mb-8">
                <h1 class="text-2xl font-semibold tracking-tight text-slate-900 dark:text-white">Schedule Mobile Service</h1>
                <p class="text-sm font-normal text-slate-500 dark:text-slate-400">Book your at-home or office appointment in under two minutes</p>
            </div>

            <!-- NATIVE INTERACTIVE MULTI-STEP APPOINTMENT FORM -->
            <form action="#" class="space-y-6 sm:space-y-8" onsubmit="event.preventDefault(); alert('Booking order locked! Check your messages for priority dispatcher configuration confirmation.');">
                
                <!-- STEP 1: VEHICLE CLASSIFICATION TRACK -->
                <div class="space-y-3">
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 block">1. Vehicle Classification</label>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <!-- Sedan button option -->
                        <div onclick="selectBookingCar('sedan')" id="bk-sedan" class="bk-vehicle-card group p-4 rounded-xl border border-brand-500 bg-brand-500/5 dark:bg-brand-500/10 text-slate-900 dark:text-white cursor-pointer transition-all flex items-center gap-3 sm:flex-col sm:text-center sm:justify-center">
                            <div class="w-10 h-10 rounded-lg bg-brand-500/10 flex items-center justify-center text-brand-500 group-hover:bg-brand-500 group-hover:text-white transition-colors">
                                <i class="fa-solid fa-car text-base"></i>
                            </div>
                            <div>
                                <h3 class="text-sm font-semibold block">Sedan / Coupe</h3>
                                <p class="text-2xs text-slate-400 dark:text-slate-500 font-normal">Standard Car Size</p>
                            </div>
                        </div>
                        <!-- SUV button option -->
                        <div onclick="selectBookingCar('suv')" id="bk-suv" class="bk-vehicle-card group p-4 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:border-slate-300 dark:hover:border-slate-700 bg-slate-50/50 dark:bg-slate-950/20 cursor-pointer transition-all flex items-center gap-3 sm:flex-col sm:text-center sm:justify-center">
                            <div class="w-10 h-10 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-500 dark:text-slate-400 group-hover:bg-brand-500 group-hover:text-white transition-colors">
                                <i class="fa-solid fa-car-side text-base"></i>
                            </div>
                            <div>
                                <h3 class="text-sm font-semibold block">SUV / Crossover</h3>
                                <p class="text-2xs text-slate-400 dark:text-slate-500 font-normal">Mid-to-Large Class</p>
                            </div>
                        </div>
                        <!-- Truck button option -->
                        <div onclick="selectBookingCar('truck')" id="bk-truck" class="bk-vehicle-card group p-4 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:border-slate-300 dark:hover:border-slate-700 bg-slate-50/50 dark:bg-slate-950/20 cursor-pointer transition-all flex items-center gap-3 sm:flex-col sm:text-center sm:justify-center">
                            <div class="w-10 h-10 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-500 dark:text-slate-400 group-hover:bg-brand-500 group-hover:text-white transition-colors">
                                <i class="fa-solid fa-truck-pickup text-base"></i>
                            </div>
                            <div>
                                <h3 class="text-sm font-semibold block">Truck / Van</h3>
                                <p class="text-2xs text-slate-400 dark:text-slate-500 font-normal">Heavy Duty Vehicles</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- STEP 2: DETAILS & LOCATION GRID -->
                <div class="space-y-4">
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 block">2. Contact & Dispatch Location</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- Client name input -->
                        <div class="space-y-1.5">
                            <label for="bk-name" class="text-xs font-medium text-slate-500 dark:text-slate-400">Your Full Name</label>
                            <input type="text" id="bk-name" required placeholder="John Doe"
                                   class="w-full px-4 py-3 text-sm rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-600" />
                        </div>
                        <!-- Phone connection contact -->
                        <div class="space-y-1.5">
                            <label for="bk-phone" class="text-xs font-medium text-slate-500 dark:text-slate-400">Mobile Phone Number</label>
                            <input type="tel" id="bk-phone" required placeholder="(555) 000-0000"
                                   class="w-full px-4 py-3 text-sm rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-600" />
                        </div>
                        <!-- Street coordinates dispatch address -->
                        <div class="space-y-1.5 sm:col-span-2">
                            <label for="bk-address" class="text-xs font-medium text-slate-500 dark:text-slate-400">Service Street Address (Home or Office Driveway)</label>
                            <input type="text" id="bk-address" required placeholder="123 Main Street, Apt 4B or Corporate Office Lot"
                                   class="w-full px-4 py-3 text-sm rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-600" />
                        </div>
                    </div>
                </div>

                <!-- STEP 3: DATE & HOURS SELECTION MATRIX -->
                <div class="space-y-4">
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 block">3. Select Preferred Schedule Slot</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- Calendar date element field -->
                        <div class="space-y-1.5">
                            <label for="bk-date" class="text-xs font-medium text-slate-500 dark:text-slate-400">Appointment Date</label>
                            <div class="relative flex items-center">
                                <input type="date" id="bk-date" required
                                       class="w-full px-4 py-3 text-sm rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all text-slate-900 dark:text-slate-100 uppercase" />
                            </div>
                        </div>
                        <!-- Time selection operational window dropdown -->
                        <div class="space-y-1.5">
                            <label for="bk-time" class="text-xs font-medium text-slate-500 dark:text-slate-400">Preferred Arrival Window</label>
                            <select id="bk-time" required
                                    class="w-full px-4 py-3 text-sm rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all text-slate-900 dark:text-slate-100 cursor-pointer">
                                <option value="" disabled selected>Select a time window</option>
                                <option value="morning-early">Morning: 08:00 AM - 11:00 AM</option>
                                <option value="midday">Midday: 11:00 AM - 02:00 PM</option>
                                <option value="afternoon">Afternoon: 02:00 PM - 05:00 PM</option>
                                <option value="evening-late">Evening: 05:00 PM - 08:00 PM</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- SUBMIT ORDER CTA ACTION BUTTON -->
                <div class="pt-2">
                    <button type="submit" class="w-full text-center bg-brand-500 hover:bg-brand-600 text-white font-semibold text-sm py-4 rounded-xl shadow-lg shadow-brand-500/10 hover:shadow-brand-500/20 transition-all duration-200 focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 uppercase tracking-wider">
                        Confirm Mobile Booking Appointment
                    </button>
                    <!-- Small auxiliary trust subheadline line -->
                    <p class="text-center text-2xs text-slate-400 dark:text-slate-500 mt-3 font-normal">
                        <i class="fa-solid fa-lock text-[10px] mr-1 rtl:ml-1"></i> Secure end-to-end scheduling. No immediate pre-payment needed. Pay on-site post-repair.
                    </p>
                </div>

            </form>

        </div>
    </main>

  

    <!-- INTERACTIVE BOOKING DASHBOARD LOGIC JAVASCRIPT LAYER -->
    <script>
        // DOM Elements
        const htmlElement = document.documentElement;
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const rtlToggleBtn = document.getElementById('rtl-toggle');

        // 1. Theme Configuration Logic (Light/Dark Engine using localStorage persistence layer)
        function updateThemeUI(isDark) {
            if (isDark) {
                htmlElement.classList.add('dark');
                themeIcon.className = "fa-solid fa-sun";
                localStorage.setItem('theme', 'dark');
            } else {
                htmlElement.classList.remove('dark');
                themeIcon.className = "fa-solid fa-moon";
                localStorage.setItem('theme', 'light');
            }
        }

        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        updateThemeUI(savedTheme === 'dark' || (!savedTheme && systemPrefersDark));

        themeToggleBtn.addEventListener('click', () => {
            updateThemeUI(!htmlElement.classList.contains('dark'));
        });


        // 2. Structural Directional Layout Toggle Logic (LTR/RTL Local Storage Persisted Engine)
        function updateDirectionUI(direction) {
            if (direction === 'rtl') {
                htmlElement.setAttribute('dir', 'rtl');
                rtlToggleBtn.textContent = 'RTL';
                localStorage.setItem('direction', 'rtl');
            } else {
                htmlElement.setAttribute('dir', 'ltr');
                rtlToggleBtn.textContent = 'LTR';
                localStorage.setItem('direction', 'ltr');
            }
        }

        const savedDirection = localStorage.getItem('direction') || 'ltr';
        updateDirectionUI(savedDirection);

        rtlToggleBtn.addEventListener('click', () => {
            const currentDir = htmlElement.getAttribute('dir');
            updateDirectionUI(currentDir === 'rtl' ? 'ltr' : 'rtl');
        });


        // 3. User Interactivity: Selection Engine for Vehicle Classification Buttons
        let selectedVehicleClass = 'sedan';

        function selectBookingCar(carType) {
            if (!carType) return;
            selectedVehicleClass = carType;

            // Reset all selection styles across the card collection matrix links
            document.querySelectorAll('.bk-vehicle-card').forEach(card => {
                card.className = "bk-vehicle-card group p-4 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:border-slate-300 dark:hover:border-slate-700 bg-slate-50/50 dark:bg-slate-950/20 cursor-pointer transition-all flex items-center gap-3 sm:flex-col sm:text-center sm:justify-center";
                
                const iconFrame = card.querySelector('.w-10');
                if (iconFrame) iconFrame.className = "w-10 h-10 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-500 dark:text-slate-400 group-hover:bg-brand-500 group-hover:text-white transition-colors";
            });

            // Lock in active highlighting properties onto chosen targeting selector option
            const targetCard = document.getElementById(`bk-${carType}`);
            if (targetCard) {
                targetCard.className = "bk-vehicle-card group p-4 rounded-xl border border-brand-500 bg-brand-500/5 dark:bg-brand-500/10 text-slate-900 dark:text-white cursor-pointer transition-all flex items-center gap-3 sm:flex-col sm:text-center sm:justify-center";
                
                const activeIconFrame = targetCard.querySelector('.w-10');
                if (activeIconFrame) activeIconFrame.className = "w-10 h-10 rounded-lg bg-brand-500/10 flex items-center justify-center text-brand-500 transition-colors";
            }
        }
    </script>
</body>
</html>
