<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

            <span class="text-lg sm:text-xl font-bold tracking-tight text-slate-900 dark:text-white">Brake<span class="text-brand-500">Doc</span></span>
        </a>

        <!-- Persistent Layout Control Toggle Buttons -->
        <div class="flex items-center space-x-2 sm:space-x-3 rtl:space-x-reverse">
                         <!-- LTR/RTL Layout Flow Toggle -->
<button id="rtl-toggle" class="w-10 h-10 inline-flex items-center justify-center rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-brand-500 hover:bg-slate-200/50 dark:hover:bg-slate-700/50 transition-all text-xs font-bold shrink-0" title="Toggle Layout Direction">
    LTR
</button>

<!-- Light/Dark Mode Theme Toggle -->
<button id="theme-toggle" class="w-10 h-10 inline-flex items-center justify-center rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-brand-500 hover:bg-slate-200/50 dark:hover:bg-slate-700/50 transition-all shrink-0" title="Toggle Theme">
    <i id="theme-icon" class="fa-solid fa-moon text-sm"></i>
</button>
        </div>
    </header>

    <!-- MAIN INTERACTIVE LOGIN BODY INTERFACE -->
    <main class="flex-grow flex items-center justify-center px-4 py-8 sm:py-12 relative z-10">
        
        <!-- Ambient Decorative Branding Flares -->
        <div class="absolute top-1/3 left-1/2 -translate-x-1/2 w-72 sm:w-[500px] h-72 sm:h-[500px] bg-brand-500/5 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Authentication Card Container Chassis -->
        <!-- Responsive mapping: full display configurations optimized across 360px up to desktop viewports -->
        <div class="w-full max-w-[440px] bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800/80 rounded-3xl shadow-xl p-6 sm:p-8 backdrop-blur-md transition-all duration-300">
            
            <!-- Context Headers -->
            <div class="space-y-1 text-center mb-8">
                <h1 class="text-2xl font-semibold tracking-tight text-slate-900 dark:text-white">Welcome Back</h1>
                <p class="text-sm font-normal text-slate-500 dark:text-slate-400">Sign in to manage your vehicle services & fleet portal</p>
            </div>

            <!-- DYNAMIC SOCIAL PROVIDER LOGIN CONTAINER -->
            <div class="space-y-3 mb-6">
    <!-- Refactored grid to accommodate 3 social login buttons cleanly -->
    <div class="grid grid-cols-3 gap-2.5">
        <!-- Google Option -->
        <button type="button" class="flex flex-col sm:flex-row items-center justify-center gap-1.5 sm:gap-2 py-3 px-2 rounded-xl border border-slate-200 dark:border-slate-800 text-xs sm:text-sm font-medium text-slate-700 dark:text-slate-300 bg-slate-50/50 dark:bg-slate-950/30 hover:bg-slate-100 dark:hover:bg-slate-950 hover:border-slate-300 dark:hover:border-slate-700 transition-all focus:outline-none">
            <i class="fa-brands fa-google text-base text-slate-500 dark:text-slate-400"></i>
            <span class="text-[11px] sm:text-xs">Google</span>
        </button>
        <!-- Apple Option -->
        <button type="button" class="flex flex-col sm:flex-row items-center justify-center gap-1.5 sm:gap-2 py-3 px-2 rounded-xl border border-slate-200 dark:border-slate-800 text-xs sm:text-sm font-medium text-slate-700 dark:text-slate-300 bg-slate-50/50 dark:bg-slate-950/30 hover:bg-slate-100 dark:hover:bg-slate-950 hover:border-slate-300 dark:hover:border-slate-700 transition-all focus:outline-none">
            <i class="fa-brands fa-apple text-base text-slate-500 dark:text-slate-400"></i>
            <span class="text-[11px] sm:text-xs">Apple</span>
        </button>
        <!-- Facebook Option -->
        <button type="button" class="flex flex-col sm:flex-row items-center justify-center gap-1.5 sm:gap-2 py-3 px-2 rounded-xl border border-slate-200 dark:border-slate-800 text-xs sm:text-sm font-medium text-slate-700 dark:text-slate-300 bg-slate-50/50 dark:bg-slate-950/30 hover:bg-slate-100 dark:hover:bg-slate-950 hover:border-slate-300 dark:hover:border-slate-700 transition-all focus:outline-none">
            <!-- Using the brand color subtly for Facebook's identity indicator -->
            <i class="fa-brands fa-facebook text-base text-blue-600 dark:text-blue-500"></i>
            <span class="text-[11px] sm:text-xs">Facebook</span>
        </button>
    </div>
    
    <!-- Structural Horizontal Rules Segment Splitter -->
    <div class="relative flex items-center justify-center py-2">
        <div class="w-full border-t border-slate-200 dark:border-slate-800"></div>
        <span class="absolute bg-white dark:bg-slate-900 px-3 text-xs font-normal text-slate-400 uppercase tracking-wider">Or email login</span>
    </div>
</div>

            <!-- NATIVE EMAIL AUTHENTICATION FORM CREDENTIALS -->
            <form action="#" class="space-y-4" onsubmit="event.preventDefault(); alert('Authentication framework activated safely.');">
                
                <!-- Email Input Block -->
                <div class="space-y-1.5">
                    <label for="email-field" class="text-xs font-medium text-slate-500 dark:text-slate-400">Email Address</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 rtl:left-auto rtl:right-4 text-slate-400 dark:text-slate-600 text-sm pointer-events-none">
                            <i class="fa-regular fa-envelope"></i>
                        </span>
                        <input type="email" id="email-field" required placeholder="name@company.com"
                               class="w-full pl-11 pr-4 rtl:pl-4 rtl:pr-11 py-3 text-sm rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-600" />
                    </div>
                </div>

                <!-- Password Input Block with Integrated Eye Toggle Icon Button -->
                <div class="space-y-1.5">
                    <label for="password-field" class="text-xs font-medium text-slate-500 dark:text-slate-400">Password</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 rtl:left-auto rtl:right-4 text-slate-400 dark:text-slate-600 text-sm pointer-events-none">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <!-- Eye interactive element nested properly inside the input wrapper box container -->
                        <input type="password" id="password-field" required placeholder="••••••••"
                               class="w-full pl-11 pr-11 rtl:pl-11 rtl:pr-11 py-3 text-sm rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-600" />
                        <!-- Eye visibility action toggle icon -->
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-4 left-auto rtl:right-auto rtl:left-4 text-slate-400 dark:text-slate-600 hover:text-brand-500 transition-colors focus:outline-none" aria-label="Toggle Password Visibility">
                            <i id="eye-icon" class="fa-regular fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <!-- AUXILIARY CONTROLS SECTION (Positioned sequentially below password box field layout) -->
                <div class="flex items-center justify-between pt-1 text-xs select-none">
                    <!-- Remember Me checkbox arrangement -->
                    <label class="flex items-center gap-2 font-medium text-slate-600 dark:text-slate-400 cursor-pointer group">
                        <input type="checkbox" class="w-4 h-4 rounded-md border-slate-300 dark:border-slate-700 text-brand-500 focus:ring-brand-500 bg-slate-50 dark:bg-slate-950 transition-colors accent-brand-500 cursor-pointer" />
                        <span class="group-hover:text-slate-900 dark:group-hover:text-slate-200 transition-colors">Remember me</span>
                    </label>
                    
                    <!-- Forgot Password action link anchor -->
                    <a href="#" class="font-medium text-brand-500 hover:text-brand-600 transition-colors">Forgot password?</a>
                </div>

                <!-- Core Sign In Submit CTA Action Button -->
                <div class="pt-2">
                    <button type="submit" class="w-full text-center bg-brand-500 hover:bg-brand-600 text-white font-semibold text-sm py-3.5 rounded-xl shadow-lg shadow-brand-500/10 hover:shadow-brand-500/20 transition-all duration-200 focus:ring-2 focus:ring-offset-2 focus:ring-brand-500">
                        Sign In to Client Account
                    </button>
                </div>

            </form>

            <!-- FOOTER REGISTRATION LINK BLOCK -->
            <div class="mt-8 text-center text-xs font-normal text-slate-500 dark:text-slate-400">
                Don't have a service portal account? 
                <a href="regeister.html" class="font-semibold text-brand-500 hover:text-brand-600 ml-1 transition-colors">Sign up</a>
            </div>

        </div>
    </main>

    <!-- COMPACT LOGIN FOOTER -->
    <footer class="w-full text-center py-6 text-2xs text-slate-400 dark:text-slate-600 border-t border-slate-200/50 dark:border-slate-900/50 relative z-50">
        <p>&copy; 2026 BrakeDoc Inc. All security metrics logs active.</p>
    </footer>

    <!-- INTERACTIVE AUTHENTICATION RUNTIME CORE JAVASCRIPT LAYER -->
    <script>
        // DOM Elements
        const htmlElement = document.documentElement;
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const rtlToggleBtn = document.getElementById('rtl-toggle');
        const passwordField = document.getElementById('password-field');
        const eyeIcon = document.getElementById('eye-icon');

        // 1. Theme Configuration Logic (Light/Dark Engine using localStorage persistence layer)
        function updateThemeUI(isDark) {
            if (isDark) {
                htmlElement.classList.add('dark');
                themeIcon.className = "fa-solid fa-sun";
                localStorage.setItem('theme', 'dark');
            } else {
                htmlElement.classList.remove('dark');
                themeIcon.className = "fa-solid fa-moon";
                localStorage.setItem('theme', 'light');
            }
        }

        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        updateThemeUI(savedTheme === 'dark' || (!savedTheme && systemPrefersDark));

        themeToggleBtn.addEventListener('click', () => {
            updateThemeUI(!htmlElement.classList.contains('dark'));
        });


        // 2. Structural Directional Layout Toggle Logic (LTR/RTL Local Storage Persisted Engine)
        function updateDirectionUI(direction) {
            if (direction === 'rtl') {
                htmlElement.setAttribute('dir', 'rtl');
                rtlToggleBtn.textContent = 'RTL';
                localStorage.setItem('direction', 'rtl');
            } else {
                htmlElement.setAttribute('dir', 'ltr');
                rtlToggleBtn.textContent = 'LTR';
                localStorage.setItem('direction', 'ltr');
            }
        }

        const savedDirection = localStorage.getItem('direction') || 'ltr';
        updateDirectionUI(savedDirection);

        rtlToggleBtn.addEventListener('click', () => {
            const currentDir = htmlElement.getAttribute('dir');
            updateDirectionUI(currentDir === 'rtl' ? 'ltr' : 'rtl');
        });


        // 3. User Interactivity Form Component Functions: Eye Password Box Visibility Toggler
        function togglePasswordVisibility() {
            if (!passwordField || !eyeIcon) return;

            if (passwordField.getAttribute('type') === 'password') {
                passwordField.setAttribute('type', 'text');
                eyeIcon.className = "fa-solid fa-eye-slash text-sm text-brand-500";
            } else {
                passwordField.setAttribute('type', 'password');
                eyeIcon.className = "fa-regular fa-eye text-sm";
            }
        }
    </script>
</body>
</html>
